height: 183
googleSheetUrl: https://docs.google.com/spreadsheets/d/1kuox8iG8QNvHe26b8bTtmaRNcCG1lDVoTH84GKkMu5M/edit?gid=0

googleOAuthSecretName: google-oauth

# Write to the sheet as the Google service account through workload identity federation, set up in omelette-gay/gitops
googleWorkloadIdentity:
  serviceAccountName: sheet-writer
  credentialsConfigMapName: google-credentials
  audience: https://iam.googleapis.com/projects/211831137824/locations/global/workloadIdentityPools/coven/providers/coven-k3s

ingress:
  hostname: chris.weight-tracker.omelette.gay
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd"
  tls:
    - hosts:
        - chris.weight-tracker.omelette.gay
      secretName: chris-ingress-tls

dbStoragePvcLabels:
  recurring-job.longhorn.io/source: enabled
  recurring-job.longhorn.io/nightly-backup: enabled
