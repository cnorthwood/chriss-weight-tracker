apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chriss-weight-tracker.fullname" . }}
  labels:
    {{- include "chriss-weight-tracker.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chriss-weight-tracker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chriss-weight-tracker.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.googleWorkloadIdentity.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "chriss-weight-tracker.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 13 }}
          args:
            - "--google-sheet"
            - "{{ .Values.googleSheetUrl }}"
            - "--server"
            - "{{ .Values.service.port }}"
          env:
            - name: WEIGHT_DATABASE
              value: "/data/db/fitbit.sqlite"
            - name: GOOGLE_REDIRECT_URI
              value: https://{{ .Values.ingress.hostname }}/
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.googleOAuthSecretName }}"
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.googleOAuthSecretName }}"
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_APPLICATION_CREDENTIALS
              {{- if .Values.googleWorkloadIdentity.serviceAccountName }}
              value: "/data/google-credentials/credentials.json"
              {{- else }}
              value: "/data/google-service-account/service-account.json"
              {{- end }}
            - name: HEIGHT
              value: "{{ .Values.height }}"
            - name: TRUST_PROXY_HEADERS
              value: "true"
          volumeMounts:
            {{- if .Values.googleWorkloadIdentity.serviceAccountName }}
            - mountPath: /data/google-credentials
              name: google-credentials
            - mountPath: {{ dir .Values.googleWorkloadIdentity.tokenPath | quote }}
              name: google-token
            {{- else }}
            - mountPath: /data/google-service-account
              name: google-service-account
            {{- end }}
            - mountPath: /data/db
              name: db
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.googleWorkloadIdentity.serviceAccountName }}
        - name: google-credentials
          configMap:
            name: {{ required "googleWorkloadIdentity.credentialsConfigMapName is required" .Values.googleWorkloadIdentity.credentialsConfigMapName | quote }}
        - name: google-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ required "googleWorkloadIdentity.audience is required" .Values.googleWorkloadIdentity.audience | quote }}
                  expirationSeconds: 3600
                  path: {{ base .Values.googleWorkloadIdentity.tokenPath | quote }}
        {{- else }}
        - name: google-service-account
          secret:
            secretName: "{{ .Values.googleServiceAccountSecretName }}"
        {{- end }}
        - name: db
          persistentVolumeClaim:
            claimName: '{{ include "chriss-weight-tracker.fullname" . }}-db'
      restartPolicy: Always
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
