# Default values for chriss-weight-tracker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# your height in cms
height: ""

# the URL of the Google Sheet to output into
googleSheetUrl: ""

# the name of the secret to read the Google OAuth client credentials from - this must have two keys in it, GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET
googleOAuthSecretName: google-oauth

# the name of the secret to read the Google service account credentials from - the body of the json file must be stored in the key `service-account.json` in this secret
# not used if googleWorkloadIdentity.serviceAccountName is set
googleServiceAccountSecretName: google-service-account

# to act as the Google service account through workload identity federation instead of with a key, set all of these
googleWorkloadIdentity:
  # the Kubernetes service account to run as, which is allowed to act as the Google service account
  serviceAccountName: ""
  # a ConfigMap holding the credentials config for Google's client libraries in the key `credentials.json`
  credentialsConfigMapName: ""
  # the audience of the workload identity pool provider (https://iam.googleapis.com/projects/...)
  audience: ""
  # where the credentials config expects the Kubernetes service account token
  tokenPath: /var/run/secrets/google/token

# how much storage to allocate for the sqlite database
dbStorageRequest: 100Mi

# the class of storage to be requested
dbStorageClassName: ""
dbStoragePvcLabels: {}

service:
  type: ClusterIP
  port: 3000

ingress:
  hostname: chriss-weight-tracker.local
  annotations: {}
  tls: []

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/cnorthwood/chriss-weight-tracker
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
